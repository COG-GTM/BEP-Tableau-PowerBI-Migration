version: 2

models:
  - name: silver_orders
    columns:
      - name: row_id
        data_tests:
          - not_null
          - unique
      - name: order_id
        data_tests:
          - not_null
      - name: customer_id
        data_tests:
          - not_null
      - name: product_id
        data_tests:
          - not_null
      - name: sales
        data_tests:
          - not_null
      - name: profit
        data_tests:
          - not_null
      - name: quantity
        data_tests:
          - not_null
  - name: silver_products
    columns:
      - name: product_id
        data_tests:
          - not_null
          - unique
  - name: silver_customers
    columns:
      - name: customer_id
        data_tests:
          - not_null
          - unique
  - name: silver_location
    columns:
      - name: postal_code
        data_tests:
          - not_null
          - unique
  - name: fact_orders
    columns:
      - name: row_id
        data_tests:
          - not_null
          - unique
      - name: order_id
        data_tests:
          - not_null
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_id
      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_id
      - name: postal_code
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_location')
                field: postal_code
      - name: sales
        data_tests:
          - not_null
      - name: profit
        data_tests:
          - not_null
      - name: quantity
        data_tests:
          - not_null
      - name: order_year
        data_tests:
          - not_null
      - name: order_month
        data_tests:
          - not_null
      - name: order_week
        data_tests:
          - not_null
  - name: dim_product
    columns:
      - name: product_id
        data_tests:
          - not_null
          - unique
  - name: dim_customer
    columns:
      - name: customer_id
        data_tests:
          - not_null
          - unique
  - name: dim_location
    columns:
      - name: postal_code
        data_tests:
          - not_null
          - unique
  - name: dim_select_year
    columns:
      - name: select_year
        data_tests:
          - not_null
          - unique
  - name: customer_orders_by_year
    columns:
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_id
      - name: year
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_select_year')
                field: select_year
      - name: nr_of_orders_per_customers
        data_tests:
          - not_null
