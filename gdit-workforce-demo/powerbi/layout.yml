- tableau_dashboard: Staffing Risk
  visuals:
  - id: z_0_2
    x: 0
    y: 0
    w: 1040
    h: 675
    type: native
    visual_type: lineClusteredColumnComboChart
    roles:
      Category:
      - column: opportunities.account_name
      Y:
      - measure: workers.Revenue at Risk (Won contracts)
      Y2:
      - measure: workers.Past Due Open HC
    title: Revenue at Risk by Account
    z: 0
  - id: z_1_3
    x: 1040
    y: 0
    w: 560
    h: 675
    type: native
    visual_type: pivotTable
    roles:
      Rows:
      - column: staffing_requests.job_family
      Columns:
      - column: staffing_requests.clearance_required
      Values:
      - measure: workers.Past Due Open HC
    title: Past Due HC by Family x Clearance
    z: 100
  - id: z_2_4
    x: 0
    y: 675
    w: 1600
    h: 225
    type: native
    visual_type: tableEx
    roles:
      Values:
      - column: staffing_requests.req_id
      - column: staffing_requests.opp_id
      - column: staffing_requests.job_family
      - column: staffing_requests.clearance_required
      - column: staffing_requests.headcount
      - column: staffing_requests.needed_by
      - measure: workers.Past Due Open HC
    title: Open Requests Detail (Won contracts)
    filters:
    - column: staffing_requests.status
      values:
      - Open
    - column: opportunities.stage
      values:
      - Won
    z: 200
  - id: z_3_5
    x: 1360
    y: 0
    w: 240
    h: 90
    type: textbox
    align: left
    paragraphs:
    - - text: Access controlled by Power BI RLS role
        font_family: Segoe UI
        font_size: 9
    z: 300
